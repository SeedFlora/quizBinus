# NUSAQUEST behind nginx (existing campus reverse proxy, or nginx on the Docker host).
#
#   sudo cp deploy/nginx/nusaquest.conf /etc/nginx/sites-available/nusaquest.conf
#   sudo ln -s ../sites-available/nusaquest.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace quiz.example.ac.id, the certificate paths and the upstream address. When nginx
# runs on the same host as docker compose, set APP_PORT=127.0.0.1:3000 in .env so the app
# is reachable only through nginx. Also set APP_URL=https://quiz.example.ac.id (and
# NEXT_PUBLIC_APP_URL for QR codes, rebuild) and TRUST_PROXY=true.
#
# The three things that matter for NUSAQUEST:
#   1. /api/sessions/<id>/events is a Server-Sent Events stream: no buffering, no gzip,
#      long read timeout (the server sends a heartbeat every 15 s).
#   2. Overwrite the client-IP headers (never append): join/answer rate limits key on them.
#   3. client_max_body_size ≥ 3m: question images are uploaded up to 2 MB (multipart).

upstream nusaquest {
    server 127.0.0.1:3000;   # or <docker-vm-ip>:3000 when nginx runs elsewhere
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                 # nginx ≥ 1.25.1; older versions: "listen 443 ssl http2;"
    server_name quiz.example.ac.id;

    ssl_certificate     /etc/ssl/certs/quiz.example.ac.id.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/quiz.example.ac.id.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 3m;

    # Both locations repeat the full proxy_set_header list: a proxy_set_header inside a
    # location replaces (does not extend) the headers inherited from the server block.

    # Live game events (SSE). Must stream frame by frame.
    location ~ ^/api/sessions/[^/]+/events$ {
        proxy_pass http://nusaquest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";               # drop client-supplied value

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://nusaquest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";

        # Lets React Server Components stream; harmless for everything else.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
