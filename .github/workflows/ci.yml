# NUSAQUEST continuous integration (self-hosted target: Docker + PostgreSQL).
#
#   verify   typecheck → lint → migrations in sync → Vitest (unit, component, and PostgreSQL
#            integration tests against a postgres:17-alpine service)         (every push & PR)
#   build    production `next build` (standalone output)                      (every push & PR)
#   docker   build the image (no push), then smoke-test the full compose stack:
#            migrations + admin bootstrap + /api/health reports db "up"       (every push & PR)
#   e2e      Playwright against the standalone production server. Slow, so it only runs
#            on demand: Actions → CI → "Run workflow" with "e2e" ticked.
#
# No secrets are needed: every credential below is a throwaway value for CI only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Playwright end-to-end suite
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nq
          POSTGRES_PASSWORD: nq
          POSTGRES_DB: nusaquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nq -d nusaquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Enables the PostgreSQL integration tests (they skip when this is unset).
      TEST_DATABASE_URL: postgres://nq:nq@localhost:5432/nusaquest_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PageProps / LayoutProps / RouteContext are global types generated into .next/types.
      # A fresh checkout has none, so generate them before running tsc on its own.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # lib/db/schema.ts and the committed SQL in drizzle/ must agree: regenerating from the
      # schema must not produce a new migration.
      - name: Migrations in sync with schema
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::lib/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            exit 1
          fi

      - name: Unit, component and database tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'locales/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: next build
        run: npm run build

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # docker-compose.yml runs nusaquest:${APP_IMAGE_TAG:-local}
          tags: nusaquest:local
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # drizzle-orm (incl. the migrator) is bundled into the server chunks; pg stays an
      # external package that output tracing must copy into node_modules.
      - name: Image contents (standalone server, pg, migrations, upload dir)
        run: |
          docker run --rm --entrypoint sh nusaquest:local -c '
            set -e
            test -f server.js
            ls drizzle/*.sql
            test -f drizzle/meta/_journal.json
            test -f node_modules/pg/package.json
            test -d data/uploads && test -w data/uploads
            test "$(id -u)" = 1000'

      - name: Throwaway .env for CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-not-a-secret
          ADMIN_EMAIL=admin@ci.invalid
          ADMIN_PASSWORD=ci-only-password-123
          ADMIN_NAME=CI Admin
          APP_URL=http://localhost:3000
          EOF

      - name: Validate compose file (all profiles)
        run: |
          docker compose config --quiet
          DOMAIN=quiz.example.ac.id docker compose --profile https --profile backup config --quiet

      - name: Start app + PostgreSQL
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -e
          health="$(curl -fsS http://localhost:3000/api/health)"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"mode":"database"'
          echo "$health" | grep -q '"db":"up"'
          for path in / /join /login /host/session/demo; do
            curl -fsS -o /dev/null -w "GET $path → %{http_code}\n" "http://localhost:3000$path"
          done
          # Migrations ran and the bootstrap admin exists.
          docker compose exec -T db psql -U nusaquest -d nusaquest -tAc \
            "select count(*) from users where role = 'admin'" | grep -qx 1

      - name: Restart keeps data (migrations are idempotent)
        run: |
          docker compose restart app
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://localhost:3000/api/health | grep -q '"db":"up"'

      - name: Container logs
        if: always()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  e2e:
    name: End-to-end (Playwright)
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Production build
        run: npm run build

      # Test exactly what Docker ships: the standalone server with its static assets, in
      # memory mode (no DATABASE_URL: demo lecturer, server-side demo session).
      # E2E_BASE_URL makes playwright.config.ts skip its own `next dev` webServer.
      - name: Start standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3200 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > standalone.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3200/api/health; then echo; exit 0; fi
            sleep 2
          done
          cat standalone.log
          exit 1

      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3200

      - name: Server log
        if: failure()
        run: cat standalone.log || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
